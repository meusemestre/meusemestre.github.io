<style id="meu-semestre-3-5-busca-menu-ajustes">
/* Meu Semestre 3.5 — refinamento da busca global e estabilidade da navegação lateral */

/* Busca global: expansão suave, sem o contorno interno quadrado do navegador */
.top-actions{position:relative;overflow:visible}

  outline:0!important;

    align-items:start;
    min-height:100vh;
    min-height:100svh;
  }
  .sidebar{
    position:sticky!important;

    top:0!important;

.perf-insights{display:grid;gap:9px}.perf-insight{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:left;transition:transform .2s ease,border-color .2s ease,background .2s ease}.perf-insight[data-nav]{cursor:pointer}.perf-insight:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--blue) 36%,var(--line));background:color-mix(in srgb,var(--blue) 3%,var(--surface))}.perf-insight>span{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--tone) 13%,var(--surface));color:var(--tone);font-size:14px;font-weight:850}.perf-insight>div{flex:1;min-width:0}.perf-insight strong{display:block;color:var(--ink);font-size:10px}.perf-insight small{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.45}.perf-insight>b{color:var(--muted)}.perf-insight-red{--tone:#e05c70}.perf-insight-amber{--tone:#e39a35}.perf-insight-purple{--tone:#8b65e8}.perf-insight-blue{--tone:#3478f6}.perf-insight-green{--tone:#12a879}

.perf-flash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}.perf-flash-stats>div{padding:12px 10px;border-radius:12px;background:var(--bg);text-align:center}.perf-flash-stats strong{display:block;color:var(--ink);font-size:22px;letter-spacing:-.7px}.perf-flash-stats small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.perf-flash-track{height:8px;border-radius:9px;background:var(--bg);overflow:hidden}.perf-flash-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b65e8,#d16fe6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.perf-upcoming-list,.perf-recent-list{display:grid}.perf-upcoming-row,.perf-recent-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.perf-upcoming-row:last-child,.perf-recent-row:last-child{border-bottom:0}.perf-upcoming-date{display:grid;place-items:center;flex:none;min-width:53px;height:39px;padding:0 5px;border-radius:10px;background:var(--soft);color:var(--blue);font-size:9px;font-weight:850}.perf-upcoming-row>div,.perf-recent-row>div{flex:1;min-width:0}.perf-upcoming-row strong,.perf-recent-row strong{display:block;color:var(--ink);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.perf-upcoming-row small,.perf-recent-row small{display:block;margin-top:3px;color:var(--muted);font-size:9px}.perf-upcoming-arrow{color:var(--muted)}.perf-time-subjects{display:grid;gap:13px}.perf-time-subject>div{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:9px}.perf-time-subject strong{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.perf-time-subject span{color:var(--muted);white-space:nowrap}.perf-time-subject>i{display:block;height:7px;border-radius:9px;background:var(--bg);overflow:hidden}.perf-time-subject>i b{display:block;height:100%;border-radius:inherit;background:var(--time-tone);transition:width .7s ease}.perf-recent-panel{margin-bottom:14px!important}.perf-recent-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:color-mix(in srgb,var(--blue) 11%,var(--surface));color:var(--blue);flex:none}.perf-recent-row>b{color:var(--ink);font-size:10px;white-space:nowrap}.perf-footer-note{padding:10px 3px 4px;color:var(--muted);font-size:9px;line-height:1.6;text-align:center}

function startFlashcardSession(deckId,mode='due'){const deck=flashcardDeck(deckId);if(!deck)return;const all=(deck.cards||[]).map(c=>({...c,deckId:deck.id,deckTitle:deck.title}));let queue=mode==='due'?all.filter(flashcardIsDue):all;if(!queue.length){toast(mode==='due'?'Você está em dia com as revisões deste baralho.':'Adicione cartões para começar a estudar.');return}flashcardStudyQueue=flashcardShuffle(queue);flashcardStudyIndex=0;flashcardRevealed=false;flashcardSelectedOption=null;flashcardSessionStartedAt=Date.now();flashcardSessionStats={reviewed:0,again:0,hard:0,good:0,easy:0,correct:0,skipped:0,deckId:deck.id};flashcardsView='study';render();trackAnalyticsEvent('flashcard_session_started',{mode})}

function scheduleFlashcardReview(card,rating){const now=Date.now(),ease=Math.max(1.3,Number(card.easeFactor)||2.5),reps=Number(card.repetitions)||0;let interval=Math.max(0,Number(card.intervalDays)||0),nextEase=ease;

function studyDuration(totalSeconds){const n=Math.max(0,Math.floor(totalSeconds||0)),h=Math.floor(n/3600),m=Math.floor((n%3600)/60),sec=n%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function studyElapsed(active,now=Date.now()){
 if(!active)return 0;
 if(active.mode==='free')return Math.max(0,Number(active.elapsedSeconds||0)+(active.status==='running'?Math.floor((now-(active.startedAt||now))/1000):0));
 return Math.max(0,Number(active.remainingSeconds||0)-(active.status==='running'?Math.floor((now-(active.startedAt||now))/1000):0));
}
function studyRangeSeconds(kind){const sessions=state.study.sessions||[],now=new Date(),today=todayISO();let start=new Date(now);
 if(kind==='today')start=new Date(`${today}T00:00:00`);
 else if(kind==='week'){const d=(now.getDay()+6)%7;start=new Date(now);start.setDate(now.getDate()-d);start.setHours(0,0,0,0)}
 else start=new Date(now.getFullYear(),now.getMonth(),1);
 return sessions.filter(x=>(new Date(x.startedAt||x.endedAt||0))>=start).reduce((sum,x)=>sum+(Number(x.seconds)||0),0);
}
function recordStudySession(seconds,completed=false,active=state.study.active){if(!active||seconds<1)return;state.study.sessions.unshift({id:uid(),subjectId:active.subjectId||'',mode:active.mode,seconds:Math.floor(seconds),startedAt:active.sessionStartedAt||new Date().toISOString(),endedAt:new Date().toISOString(),completed:!!completed});state.study.sessions=state.study.sessions.slice(0,500)}
function startStudy(){const study=state.study,now=Date.now();if(study.active){const a=study.active;if(a.status==='paused'){a.startedAt=now;a.status='running';save();render();return}return;}
 const subjectId=$('#studySubject')?.value||study.selectedSubjectId||'',mode=study.mode||'free';study.selectedSubjectId=subjectId;
 if(mode==='free')study.active={mode,status:'running',subjectId,elapsedSeconds:0,startedAt:now,sessionStartedAt:new Date(now).toISOString()};
 else{const seconds=Math.max(1,Number(study.settings.focusMinutes)||25)*60;study.active={mode,status:'running',subjectId,sessionType:'focus',cycle:1,durationSeconds:seconds,remainingSeconds:seconds,startedAt:now,sessionStartedAt:new Date(now).toISOString()};}
 save();render();
}
function pauseStudy(){const a=state.study.active;if(!a||a.status!=='running')return;const elapsed=Math.floor((Date.now()-(a.startedAt||Date.now()))/1000);if(a.mode==='free')a.elapsedSeconds=Math.max(0,Number(a.elapsedSeconds||0)+elapsed);else a.remainingSeconds=Math.max(0,Number(a.remainingSeconds||0)-elapsed);a.startedAt=null;a.status='paused';save();render()}

function finishPomodoroPhase(){const a=state.study.active;if(!a||a.mode!=='pomodoro')return;const now=Date.now();
 if(a.sessionType==='focus'){
  recordStudySession(Number(a.durationSeconds)||0,true,a);
  const every=Math.max(2,Number(state.study.settings.cycles)||4),isLong=(Number(a.cycle)||1)%every===0;
  const mins=isLong?state.study.settings.longBreakMinutes:state.study.settings.shortBreakMinutes;
  a.sessionType=isLong?'longBreak':'shortBreak';a.durationSeconds=Math.max(1,Number(mins)||5)*60;a.remainingSeconds=a.durationSeconds;a.startedAt=now;a.sessionStartedAt=new Date(now).toISOString();
  save();if(currentPage==='study')render();toast(isLong?'Ciclo concluído! Hora de uma pausa longa.':'Foco concluído! Hora de uma pausa.');
 }else{
  const every=Math.max(2,Number(state.study.settings.cycles)||4);
  a.cycle=(a.sessionType==='longBreak'||Number(a.cycle)>=every)?1:Number(a.cycle||1)+1;
  a.sessionType='focus';a.durationSeconds=Math.max(1,Number(state.study.settings.focusMinutes)||25)*60;a.remainingSeconds=a.durationSeconds;a.startedAt=now;a.sessionStartedAt=new Date(now).toISOString();
  save();if(currentPage==='study')render();toast('Pausa encerrada. Vamos voltar ao foco!');
 }
}

}

function documentPlainText(html){const box=document.createElement('div');box.innerHTML=html||'';return (box.innerText||box.textContent||'').replace(/\u00a0/g,' ').trim()}
function sanitizeDocumentHTML(input){
 const parser=new DOMParser(),parsed=parser.parseFromString(`<div>${String(input||'')}</div>`,'text/html'),root=parsed.body.firstElementChild;
 const allowed=new Set(['P','DIV','H1','H2','H3','H4','FONT','STRONG','B','EM','I','U','S','DEL','UL','OL','LI','BR','HR','BLOCKQUOTE','SPAN','A','IMG','TABLE','THEAD','TBODY','TR','TH','TD']);
 const clean=node=>{for(const child of Array.from(node.childNodes)){if(child.nodeType===8){child.remove();continue}if(child.nodeType!==1)continue;if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED'].includes(child.tagName)){child.remove();continue}if(!allowed.has(child.tagName)){clean(child);child.replaceWith(...Array.from(child.childNodes));continue}
   const keep={};for(const attr of Array.from(child.attributes)){const n=attr.name.toLowerCase(),v=attr.value;if(n==='style'){const safe=[];for(const part of v.split(';')){const [rawKey,...rest]=part.split(':');const key=(rawKey||'').trim().toLowerCase(),value=rest.join(':').trim();if(['text-align','font-weight','font-style','text-decoration','font-size','font-family','color','background-color'].includes(key)&&!/(url\s*\(|expression\s*\()/i.test(value))safe.push(`${key}:${value}`)}if(safe.length)keep.style=safe.join(';')}
    else if(['colspan','rowspan','alt','title'].includes(n))keep[n]=v;
    else if(n==='face'&&child.tagName==='FONT'&&/^[a-zA-Z0-9 ,'-]{1,60}$/.test(v))keep.face=v;
    else if(n==='size'&&child.tagName==='FONT'&&/^[1-7]$/.test(v))keep.size=v;
    else if(n==='href'&&child.tagName==='A'&&/^(https?:|mailto:)/i.test(v))keep.href=v;
    else if(n==='src'&&child.tagName==='IMG'&&/^https:\/\//i.test(v))keep.src=v;
   }for(const a of Array.from(child.attributes))child.removeAttribute(a.name);Object.entries(keep).forEach(([k,v])=>child.setAttribute(k,v));clean(child);
  }};clean(root);return root.innerHTML;
}

 const base=initial().planner;
 state.planner.settings={...base.settings,...(state.planner.settings||{})};
 state.planner.settings.days=Array.isArray(state.planner.settings.days)?state.planner.settings.days.map(Number).filter(n=>n>=0&&n<=6):base.settings.days.slice();

async function removeEntity(type,id){if(!confirm('Tem certeza de que deseja excluir este registro?'))return;const map={semester:'semesters',subject:'subjects',schedule:'schedules',task:'tasks',grade:'grades',attendance:'attendance',event:'events',material:'materials'};if(type==='semester'){if(state.activeSemesterId===id)state.activeSemesterId=null;state.semesters=state.semesters.filter(x=>x.id!==id);['subjects','schedules','tasks','grades','attendance','events','materials'].forEach(k=>state[k]=state[k].filter(x=>x.semesterId!==id))}else{if(type==='material'){let m=getEntity(type,id);if(m.fileId)await dbDelete(FILE_STORE,m.fileId)}if(type==='subject'){for(const m of state.materials.filter(x=>x.subjectId===id)){if(m.fileId)await dbDelete(FILE_STORE,m.fileId)}for(const k of ['schedules','tasks','grades','attendance','events','materials'])state[k]=state[k].filter(x=>x.subjectId!==id)}state[map[type]]=state[map[type]].filter(x=>x.id!==id)}save();render();toast('Registro excluído.')}

function dataURLToBlob(dataURL){let [meta,b64]=dataURL.split(',');let mime=(meta.match(/:(.*?);/)||[])[1]||'application/octet-stream';let bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}

async function verifySnapshot(expected){
 const target=JSON.stringify(expected);
 let localMatch=false,dbMatch=false;
 try{const local=readLocalSnapshot();localMatch=!!local&&JSON.stringify(local.data)===target}catch(e){}
 try{const rec=await dbGet(STORE,STATE_ID);dbMatch=!!rec?.data&&JSON.stringify(rec.data)===target}catch(e){}
 return {ok:localMatch||dbMatch,localMatch,dbMatch};
}
async function restore(file){
 try{
  const payload=JSON.parse(await file.text());
  if(payload.app!=='Meu Semestre'||!payload.state||!Array.isArray(payload.state.semesters)||!Array.isArray(payload.state.subjects))throw new Error('Formato de backup inválido');
  if(!confirm('Restaurar este backup substituirá os dados atuais desta instalação. Faça um backup atual antes de continuar. Deseja prosseguir?'))return;
  const base=initial();
  const imported={...base,...payload.state,profile:{...base.profile,...payload.state.profile},settings:{...base.settings,...payload.state.settings}};
  if(db){for(const f of payload.files||[]){if(f?.id&&f?.data)await dbPut(FILE_STORE,{id:f.id,blob:dataURLToBlob(f.data),name:f.name||'arquivo',type:f.type||'application/octet-stream',size:f.size||0})}}
  state=imported;
  const persisted=await save();
  const verification=await verifySnapshot(imported);
  render();
  if(persisted&&verification.ok)toast('Backup restaurado e verificado no armazenamento deste navegador.');
  else toast('Os dados foram carregados na tela, mas a gravação não foi confirmada. Não atualize; exporte o backup e tente novamente.');
 }catch(e){toast('Não foi possível restaurar: '+e.message)}
}

:root{
 --blue:#2563eb;--blue2:#3b82f6;--ink:#17243d;--muted:#66758f;
 --line:#e5ecf7;--bg:#f4f7fd;--surface:#fff;--soft:#eaf1ff;
 --green:#0f9f78;--amber:#d97706;--red:#dc5264;--purple:#7756df;

 --focus-ring:0 0 0 4px rgba(59,130,246,.15);
}
html{scroll-behavior:smooth;scroll-padding-top:82px}
body{font-family:"Manrope",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.58;letter-spacing:-.012em;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body:not(.dark){color-scheme:light}

button,input,select,textarea{font-family:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0;box-shadow:var(--focus-ring)}

/* Navegação e marca */
.sidebar{background:linear-gradient(180deg,#fff 0%,#f9fbff 100%);border-right:1px solid #e7edf8;box-shadow:7px 0 30px rgba(31,61,112,.035);padding-top:24px}

.nav-item svg{width:20px;height:20px;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.nav-item:hover{background:#edf4ff;color:#1d5bd7;transform:translateX(2px)}
.nav-item.active{color:#1d5bd7;background:linear-gradient(100deg,#e8f0ff,#f1f6ff);box-shadow:inset 3px 0 0 #3478f6,0 4px 14px rgba(37,99,235,.055)}
.nav-item.active svg{stroke-width:2.05}
.nav-badge{font-size:10px;font-weight:800;background:#fff;border-color:#dce7fa;color:#4773c5;padding:2px 8px}
.side-semester{border-radius:16px;background:linear-gradient(135deg,#f0f5ff,#fbfdff);border-color:#e0e9fa;padding:14px}
.avatar{width:38px;height:38px;border:2px solid #fff;box-shadow:0 2px 9px rgba(37,99,235,.14)}
.profile-mini-name{font-size:12px}
.profile-mini-sub{font-size:10px}

/* Barra superior e hierarquia de conteúdo */
.main{background:transparent}
.topbar{height:74px;padding-left:34px;padding-right:34px;background:rgba(255,255,255,.82);border-color:rgba(226,234,246,.9);box-shadow:0 3px 18px rgba(24,48,88,.025)}
.crumb{font-size:12px;font-weight:600}
.crumb b{font-weight:800;color:#263957}

.search input{font-size:12px}

.content{padding:34px 34px 55px;max-width:1580px}

.page-head p{font-size:13px;line-height:1.55;margin-top:8px;color:var(--muted)}

/* Botões e elementos de interação */
.btn{border-radius:12px;padding:10px 15px;font-size:11.5px;font-weight:800;letter-spacing:-.01em;gap:8px;transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}

.btn-small{padding:8px 11px;font-size:10.5px;border-radius:10px}
.btn:active,.icon-btn:active,.nav-item:active{transform:scale(.98)}

.welcome-meta{gap:11px;margin-top:16px}
.welcome-tag{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:750;backdrop-filter:blur(8px)}
.welcome-tag svg{width:14px;height:14px}

.welcome-actions .btn-primary:hover{background:#f1f6ff;color:#1648ad}
.welcome-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.27);color:#fff;backdrop-filter:blur(8px)}
.welcome-ghost:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45);color:#fff}

 const semName=id=>state.semesters.find(x=>x.id===id)?.name||'Sem semestre vinculado';
 const rows=[];
 const push=(items,type,page,label,titleOf,subOf,hayOf)=>items.forEach(x=>rows.push({id:x.id,type,page,label,title:String(titleOf(x)||'Registro'),sub:String(subOf(x)||''),hay:String(hayOf(x)||'')}));
 push(state.semesters,'semester','semesters','Semestre',x=>x.name,x=>[x.startDate&&fmtDate(x.startDate),x.endDate&&fmtDate(x.endDate)].filter(Boolean).join(' · '),x=>`${x.name} ${x.startDate||''} ${x.endDate||''}`);
 push(state.subjects,'subject','subjects','Disciplina',x=>x.name,x=>[x.code,x.professor,semName(x.semesterId)].filter(Boolean).join(' · '),x=>`${x.name} ${x.code||''} ${x.professor||''} ${x.description||''} ${x.room||''}`);
 push(state.tasks,'task','tasks','Atividade',x=>x.title,x=>[subjectName(x.subjectId),x.due?`Prazo ${fmtDate(x.due)}`:'Sem prazo'].join(' · '),x=>`${x.title} ${x.description||''} ${x.type||''} ${subjectName(x.subjectId)} ${semName(x.semesterId)}`);
 push(state.grades,'grade','grades','Avaliação',x=>x.title,x=>[subjectName(x.subjectId),x.date?fmtDate(x.date):'Sem data'].join(' · '),x=>`${x.title} ${x.type||''} ${x.notes||''} ${subjectName(x.subjectId)} ${semName(x.semesterId)}`);
 push(state.schedules,'schedule','schedule','Horário',x=>subjectName(x.subjectId),x=>`${dayNames[Number(x.day)]||'Aula'} · ${x.start||'Horário não informado'}`,x=>`${subjectName(x.subjectId)} ${dayNames[Number(x.day)]||''} ${x.start||''} ${x.end||''} ${x.room||''} ${x.kind||''}`);
 push(state.attendance,'attendance','attendance','Frequência',x=>subjectName(x.subjectId),x=>`${x.date?fmtDate(x.date):'Sem data'} · ${x.status==='present'?'Presença':x.status==='absent'?'Falta':'Registro'}`,x=>`${subjectName(x.subjectId)} ${x.date||''} ${x.status||''} ${x.note||''}`);
 push(state.events,'event','calendar','Evento',x=>x.title,x=>[x.date?fmtDate(x.date):'Sem data',x.type||'Evento'].join(' · '),x=>`${x.title} ${x.description||''} ${x.type||''} ${subjectName(x.subjectId)}`);
 push(state.materials,'material','materials','Material',x=>x.title,x=>[x.category,subjectName(x.subjectId)].filter(Boolean).join(' · '),x=>`${x.title} ${x.category||''} ${x.description||''} ${x.fileName||''} ${x.url||''} ${subjectName(x.subjectId)}`);
  push(state.documents||[],'document','documents','Documento',x=>x.title,x=>[subjectName(x.subjectId),documentModifiedLabel(x.updatedAt)].filter(Boolean).join(' · '),x=>`${x.title||''} ${documentPlainText(x.html||'')}`);
 push(state.flashcards?.decks||[],'flashcard-deck','flashcards','Baralho',x=>x.title,x=>[subjectName(x.subjectId),`${(x.cards||[]).length} cartões`].join(' · '),x=>`${x.title||''} ${x.description||''} ${subjectName(x.subjectId)} ${(x.cards||[]).map(c=>`${c.front||''} ${c.back||''}`).join(' ')}`);
 return rows;
}
function closeGlobalSearch(){const box=$('#globalSearchResults');if(box){box.classList.remove('open');box.innerHTML=''}}
function renderGlobalSearch(value){
 const box=$('#globalSearchResults');if(!box)return;
 const query=String(value||'').trim().toLocaleLowerCase('pt-BR');
 if(query.length<2){closeGlobalSearch();return}
 const results=globalSearchEntries().filter(x=>`${x.title} ${x.sub} ${x.hay} ${x.label}`.toLocaleLowerCase('pt-BR').includes(query)).slice(0,9);
 box.innerHTML=results.length?`<div class="search-results-heading">RESULTADOS <span>${results.length}${results.length===9?'+':''}</span></div>${results.map(x=>`<button type="button" class="search-result" role="option" data-search-type="${esc(x.type)}" data-search-page="${esc(x.page)}" data-search-id="${esc(x.id)}"><span class="search-result-icon">${x.type==='subject'?'▤':x.type==='task'?'✓':x.type==='grade'?'↗':x.type==='schedule'?'◷':x.type==='attendance'?'◉':x.type==='event'?'▦':x.type==='material'?'▧':'▣'}</span><span class="search-result-copy"><strong>${esc(x.title)}</strong><small>${esc(x.sub||x.label)}</small></span><span class="search-result-type">${esc(x.label)}</span></button>`).join('')}`:`<div class="search-empty"><strong>Nenhum resultado encontrado</strong><span>Tente outro nome, disciplina ou palavra-chave.</span></div>`;
 box.classList.add('open');
}
$('#globalSearchResults').addEventListener('click',e=>{
 const item=e.target.closest('[data-search-type]');if(!item)return;
 const type=item.dataset.searchType,id=item.dataset.searchId,page=item.dataset.searchPage;
 closeGlobalSearch();$('#globalSearch').value='';searchTerm='';if(type==='document'){navigate('documents');openDocument(id);return;}navigate(page);
 if(type==='subject')subjectDetail(id);else if(type==='flashcard-deck')openFlashcardDeck(id);else openEntity(type,id);
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-area'))closeGlobalSearch()});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
$('#content').addEventListener('click',e=>{const editorTool=e.target.closest('[data-editor-cmd]');if(editorTool){e.preventDefault();executeEditorCommand(editorTool);return}const n=e.target.closest('[data-nav]');if(n){navigate(n.dataset.nav);return}const b=e.target.closest('[data-action]');if(b)handleAction(b)});
 $('#content').addEventListener('mousedown',e=>{if(e.target.closest('[data-editor-cmd]'))e.preventDefault()});
 document.addEventListener('selectionchange',()=>{const stack=$('#docPaperStack'),selection=window.getSelection();if(stack&&selection&&selection.rangeCount&&stack.contains(selection.anchorNode)){documentSavedRange=selection.getRangeAt(0).cloneRange();const node=selection.anchorNode,el=node.nodeType===1?node:node.parentElement,page=el?.closest?.('.doc-editor[data-doc-page-editor]');if(page){activeDocPageIndex=Number(page.dataset.docPageIndex)||0;updateDocumentPageControls()}}});
 $('#content').addEventListener('input',e=>{if(e.target.matches('.doc-editor[data-doc-page-editor]')){activeDocPageIndex=Number(e.target.dataset.docPageIndex)||0;requestAnimationFrame(()=>{paginateDocumentPages();queueDocumentSave()})}if(e.target.id==='documentTitle')queueDocumentSave();if(e.target.id==='fcDeckSearch'){flashcardDeckSearch=e.target.value;const q=flashcardDeckSearch.toLocaleLowerCase('pt-BR');$$('.fc-deck-card').forEach(card=>{card.hidden=!card.innerText.toLocaleLowerCase('pt-BR').includes(q)});}if(e.target.id==='documentsFilter'){const q=e.target.value.trim().toLocaleLowerCase('pt-BR');let visible=0;$$('#documentsList .doc-library-row').forEach(row=>{const show=row.dataset.docSearch.toLocaleLowerCase('pt-BR').includes(q);row.hidden=!show;if(show)visible++});const empty=$('#documentsFilterEmpty');if(empty)empty.hidden=visible>0||!q;}});
 $('#content').addEventListener('focusin',e=>{const page=e.target.closest?.('.doc-editor[data-doc-page-editor]');if(page){activeDocPageIndex=Number(page.dataset.docPageIndex)||0;updateDocumentPageControls()}});
 $('#content').addEventListener('change',e=>{if(e.target.id==='performanceRange'){performanceRange=e.target.value;render();return}if(['docSubject','docSemester','documentTitle'].includes(e.target.id))queueDocumentSave();if(e.target.matches('[data-editor-font]')){restoreDocumentSelection();document.execCommand('fontName',false,e.target.value);queueDocumentSave()}if(e.target.matches('[data-editor-size]')){restoreDocumentSelection();document.execCommand('fontSize',false,e.target.value);queueDocumentSave()}});
$('#modalBody').addEventListener('submit',handleEntitySubmit);$('#modalBody').addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action)handleAction(action)});$('#modalBody').addEventListener('input',e=>{if(e.target.id==='subjectColorInput'){const label=$('#subjectColorValue');if(label)label.textContent=validSubjectColor(e.target.value).toUpperCase()}});
$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
$('#content').addEventListener('change',e=>{if(e.target.id==='fcDailyGoal'){ensureFlashcards().settings.dailyGoalCards=Number(e.target.value)||20;save();toast('Meta diária atualizada.');return}if(e.target.id==='fcImportFile'){const f=e.target.files?.[0];if(f)importFlashcardDeck(f);e.target.value='';return}if(e.target.id==='restoreFile'){const f=e.target.files?.[0];if(f)restore(f);e.target.value='';return}if(e.target.id==='taskFilter'){activeFilter=e.target.value;render();$('#taskFilter').value=activeFilter}if(e.target.id==='themeSelect'){state.settings.theme=e.target.value;applyTheme();save()} });
$('#content').addEventListener('click',e=>{if(e.target.closest('[data-action="edit-subject"]')){let btn=e.target.closest('[data-action="edit-subject"]');openEntity('subject',btn.dataset.id)}});
$('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value;if(['subjects','tasks','schedule','grades','attendance','materials'].includes(currentPage))render();renderGlobalSearch(e.target.value)});
$('#authButton').addEventListener('click',e=>{e.preventDefault();if(!authActionInProgress)handleGoogleAccount();});
$('#themeToggle').addEventListener('click',()=>{const dark=document.body.classList.contains('dark');state.settings.theme=dark?'light':'dark';applyTheme();save();if(currentPage==='settings')render()});$('#quickAdd').addEventListener('click',()=>{if(currentPage==='documents')createDocument('blank');else if(currentPage==='flashcards')openFlashcardDeckModal();else if(currentPage==='planner')openPlannerBlockModal();else if(currentPage==='subjects')add('subject');else if(currentPage==='schedule')add('schedule');else if(currentPage==='grades')add('grade');else if(currentPage==='calendar')add('event');else add('task')});
$('#menuToggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('show')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')});
$('#content').addEventListener('change',e=>{
 if(e.target.id==='timeFormat'){state.settings.timeFormat=e.target.value;save()}
 if(e.target.id==='studySubject'){state.study.selectedSubjectId=e.target.value;save()}
 const studyFields={studyDailyGoal:['dailyGoalMinutes',1,1440],studyFocusMinutes:['focusMinutes',1,180],studyShortBreakMinutes:['shortBreakMinutes',1,60],studyLongBreakMinutes:['longBreakMinutes',1,90],studyCycles:['cycles',2,8]};
 const config=studyFields[e.target.id];if(config){const [key,min,max]=config;const value=Math.max(min,Math.min(max,Number(e.target.value)||min));state.study.settings[key]=value;save();if(e.target.value!==String(value))e.target.value=value;}
 });
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeGlobalSearch()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus();$('#globalSearch').select()}});
window.addEventListener('keydown',e=>{if(currentPage!=='flashcards'||flashcardsView!=='study'||$('#modalBackdrop')?.classList.contains('open'))return;const tag=e.target?.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||e.target?.isContentEditable)return;if(e.code==='Space'){e.preventDefault();if(!flashcardRevealed)flashcardHandleAction('flashcard-reveal',document.createElement('button'),'');}else if(flashcardRevealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();rateFlashcard(({1:'again',2:'hard',3:'good',4:'easy'})[e.key]);}});
const systemThemeQuery=window.matchMedia?.('(prefers-color-scheme: dark)');systemThemeQuery?.addEventListener?.('change',()=>{if(state.settings.theme==='system')applyTheme()});
window.addEventListener('pagehide',saveBeforeLeaving);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveBeforeLeaving()});
(async()=>{await load();updateAuthButton();studyTicker=setInterval(updateStudyClock,1000);})();
})();
